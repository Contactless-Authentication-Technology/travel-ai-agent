<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Travel Agent</title>

    <style>
      body {
        width: 260px;
        padding: 12px;
        font-family: Arial, sans-serif;
      }

      h3 {
        margin-top: 0;
      }

      .field {
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }

      input {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        cursor: pointer;
      }

      pre {
        white-space: pre-wrap;
        margin-top: 10px;
        font-size: 12px;
      }

      textarea {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <h3>Travel AI Agent</h3>

    <div class="field">
      <label>Destination</label>
      <input id="destinationInput" value="Paris" />
    </div>

    <div class="field">
      <label>Check-In</label>
      <input id="checkInInput" type="date" value="2026-07-10" />
    </div>

    <div class="field">
      <label>Check-Out</label>
      <input id="checkOutInput" type="date" value="2026-07-15" />
    </div>

    <div class="field">
      <label>Adults</label>
      <input id="adultsInput" type="number" value="2" min="1" />
    </div>

    <div class="field">
      <label>Booking Payload JSON</label>
      <textarea id="payloadTextarea" rows="8">
    {
      "site": "booking.com",
      "payload": {
        "destination": "Paris",
        "checkIn": "2026-07-10",
        "checkOut": "2026-07-15",
        "adults": 2
      }
    }
      </textarea>
    </div>

    <button id="runFlowButton">
      Run Booking Flow
    </button>

    <pre id="result"></pre>

    <script src="popup.js"></script>
  </body>
</html>
