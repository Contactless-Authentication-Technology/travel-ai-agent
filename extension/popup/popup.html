<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Travel Agent</title>

    <style>
      body {
        width: 260px;
        padding: 12px;
        font-family: Arial, sans-serif;
      }

      h3 {
        margin-top: 0;
      }

      .field {
        margin-bottom: 10px;
      }

      label {
        display: block;
        font-size: 12px;
        margin-bottom: 4px;
      }

      input {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
      }

      button {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        cursor: pointer;
      }

      pre {
        white-space: pre-wrap;
        margin-top: 10px;
        font-size: 12px;
      }

      textarea {
        width: 100%;
        padding: 6px;
        box-sizing: border-box;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <h3>Travel AI Agent</h3>

    <div class="field">
      <label>Natural Language Request</label>
      <textarea id="naturalLanguageTextarea" rows="5">
    7월 10일부터 7월 15일까지 파리 여행 가고 싶어. 성인 2명이고 에펠탑 근처 호텔이면 좋겠어.
      </textarea>
    </div>  

    <div class="field">
      <label>Booking Payload JSON</label>
      <textarea id="payloadTextarea" rows="10">
  {
    "site": "booking.com",
    "payload": {
      "destination": "Paris",
      "checkIn": "2026-07-10",
      "checkOut": "2026-07-15",
      "adults": 2
    }
  }
      </textarea>
    </div>

    <button id="convertRequestButton">
      Convert Request
    </button>

    <button id="runFlowButton">Run Booking Flow</button>

    <button id="extractHotelsButton">Extract Hotels</button>

    <button id="clickHotelButton">Click First Hotel</button>

    <button id="clickBestMatchedHotelButton">Click Best Matched Hotel</button>

    <button id="confirmHotelSelectionButton">
      Confirm Hotel Selection
    </button>
    <pre id="result"></pre>

    <script src="popup.js"></script>
  </body>
</html>
